<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Análisis Avanzado de Alimentos y Nutrición</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #0C2142;
      --card-hover-box-shadow: rgba(12, 33, 66, 0.15);
    }
    body {
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .page-link {
      color: var(--primary-color);
    }
    .page-item.active .page-link {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .alimento-card {
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      cursor: pointer;
      border: 1px solid #e2e8f0;
    }
    .alimento-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--card-hover-box-shadow) !important;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <h1 class="mb-4 text-center fw-bold" style="color: var(--primary-color);">Catálogo de Alimentos y Nutrición</h1>
    
    <div id="alimentos-section">
      <div class="mb-4">
        <input type="text" id="buscador-alimentos" class="form-control form-control-lg shadow-sm" placeholder="Buscar alimento por nombre, categoría o propiedad...">
      </div>
      <div class="row g-3" id="alimentos-list"></div>
      <nav>
        <ul class="pagination justify-content-end my-4" id="alimentos-pagination"></ul>
      </nav>
    </div>

    <div class="modal fade" id="alimentoModal" tabindex="-1" aria-labelledby="alimentoModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header text-white" style="background-color: var(--primary-color);">
            <h5 class="modal-title fw-bold" id="alimentoModalLabel">Información del Alimento</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            
            <ul class="nav nav-tabs mb-3" id="modalTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active fw-semibold" id="tab-detalles" data-bs-toggle="tab" data-bs-target="#pane-detalles" type="button" role="tab">Detalles</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold" id="tab-nutricion" data-bs-toggle="tab" data-bs-target="#pane-nutricion" type="button" role="tab">Tabla Nutricional</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold" id="tab-grafico" data-bs-toggle="tab" data-bs-target="#pane-grafico" type="button" role="tab">Análisis Visual Avanzado 📊</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link fw-semibold" id="tab-mapa" data-bs-toggle="tab" data-bs-target="#pane-mapa" type="button" role="tab">Zonas de Origen</button>
              </li>
            </ul>
            
            <div class="tab-content">
              <div class="tab-pane fade show active" id="pane-detalles" role="tabpanel">
                <div id="modal-detalles"></div>
              </div>
              
              <div class="tab-pane fade" id="pane-nutricion" role="tabpanel">
                <div id="modal-nutricion"></div>
              </div>
              
              <div class="tab-pane fade" id="pane-grafico" role="tabpanel">
                <div id="modal-grafico" class="py-2">
                  <div class="row g-3 mb-4 text-center" id="semaforo-nutricional"></div>
                  
                  <div class="row g-4">
                    <div class="col-md-6 text-center">
                      <div class="card p-3 shadow-sm h-100">
                        <h6 class="fw-bold text-secondary">Distribución de Macronutrientes (g)</h6>
                        <div style="height: 250px; position: relative;"><canvas id="chartMacros"></canvas></div>
                      </div>
                    </div>
                    <div class="col-md-6 text-center">
                      <div class="card p-3 shadow-sm h-100">
                        <h6 class="fw-bold text-secondary">Estructura de Carbohidratos (g)</h6>
                        <div style="height: 250px; position: relative;"><canvas id="chartCarbos"></canvas></div>
                      </div>
                    </div>
                    <div class="col-md-6 text-center">
                      <div class="card p-3 shadow-sm h-100">
                        <h6 class="fw-bold text-secondary">Balance de Minerales Esenciales (mg)</h6>
                        <div style="height: 250px; position: relative;"><canvas id="chartMinerales"></canvas></div>
                      </div>
                    </div>
                    <div class="col-md-6 text-center">
                      <div class="card p-3 shadow-sm h-100">
                        <h6 class="fw-bold text-secondary">Perfil de Vitaminas Coexistentes (mg/mcg)</h6>
                        <div style="height: 250px; position: relative;"><canvas id="chartVitaminas"></canvas></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              
              <div class="tab-pane fade" id="pane-mapa" role="tabpanel">
                <div id="modal-mapa" class="rounded shadow-sm" style="height:430px; width:100%;"></div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module">
    import { createChat } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";
    
    // Configuración de endpoints e integraciones
    const DATA_URL = 'https://script.google.com/macros/s/AKfycbxaPDOAWnVgYoqi8oMwgyiGE4TESmj2sZD37xJtg8ghR5P9hS7G12Ncfwmik5LdO5qv/exec';
    const CHAT_WEBHOOK_URL = 'https://n8n-ideais.appx.ec/webhook/a1226884-d5d5-4a8a-8cec-86ef7ff44cbb/chat';

    // Manejo de Persistencia en Caché Local
    function getCachedData() {
      const cached = localStorage.getItem('alimentosData');
      if (!cached) return null;
      try { return JSON.parse(cached); } catch { return null; }
    }

    function setCachedData(data) {
      localStorage.setItem('alimentosData', JSON.stringify(data));
    }

    async function fetchData() {
      const res = await fetch(DATA_URL);
      return await res.json();
    }

    // Almacenamiento y Estado Global del Sistema
    let GLOBAL_DATA = { alimentos: [], perfiles_nutricionales: [] };
    let alimentosCurrentPage = 1;
    const alimentosPerPage = 6;
    let alimentosFiltradosGlobal = [];
    
    // Instancias de Gráficos para Limpieza y Reinicialización Controlada
    let chartMacrosInstance = null;
    let chartCarbosInstance = null;
    let chartMineralesInstance = null;
    let chartVitaminasInstance = null;

    // Pintado del Grid Principal de la Aplicación
    function renderAlimentos(alimentos, page = 1) {
      const cont = document.getElementById('alimentos-list');
      if (!cont) return;
      cont.innerHTML = '';
      if (!alimentos) alimentos = [];
      alimentosFiltradosGlobal = alimentos;
      alimentosCurrentPage = page;
      
      const start = (page - 1) * alimentosPerPage;
      const end = start + alimentosPerPage;
      const alimentosPagina = alimentos.slice(start, end);
      
      alimentosPagina.forEach((alimento) => {
        cont.innerHTML += `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm alimento-card alimento-click" data-id="${alimento.id}">
              ${alimento.imagen ? 
                `<img src="${alimento.imagen}" class="card-img-top" alt="${alimento.nombre}" style="height:180px; object-fit:cover;">` : 
                `<div class="bg-secondary-subtle d-flex align-items-center justify-content-center" style="height:180px;"><span class="text-muted">${alimento.categoria || 'Alimento'}</span></div>`}
              <div class="card-body">
                <span class="badge bg-primary mb-2">${alimento.categoria || 'General'}</span>
                <h5 class="card-title fw-bold text-dark mb-1">${alimento.nombre}</h5>
                <p class="card-text text-muted text-truncate" style="font-size: 0.9rem;">${alimento.descripcion_nutricional || 'Ver desglose analítico completo.'}</p>
                <small class="text-muted d-block mt-2">📍 Origen: ${alimento.origen || 'No especificado'}</small>
              </div>
            </div>
          </div>
        `;
      });

      // Vinculación de Eventos de Apertura de Detalles
      document.querySelectorAll('.alimento-click').forEach(card => {
        card.addEventListener('click', function() {
          const id = this.getAttribute('data-id');
          mostrarDetallesYNutricion(id);
        });
      });
      renderAlimentosPagination(alimentos.length, page);
    }

    // Generador de Componente de Paginación Avanzada
    function renderAlimentosPagination(total, currentPage) {
      const pagCont = document.getElementById('alimentos-pagination');
      if (!pagCont) return;
      pagCont.innerHTML = '';
      const totalPages = Math.ceil(total / alimentosPerPage);
      if (totalPages <= 1) return;
      
      let html = `<li class="page-item${currentPage === 1 ? ' disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">Anterior</a></li>`;
      let pageList = [];
      if (totalPages <= 8) {
        for (let i = 1; i <= totalPages; i++) pageList.push(i);
      } else {
        pageList.push(1);
        if (currentPage > 4) pageList.push('...');
        for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) {
          if (i !== 1 && i !== totalPages) pageList.push(i);
        }
        if (currentPage < totalPages - 3) pageList.push('...');
        pageList.push(totalPages);
      }
      
      pageList.forEach(i => {
        if (i === '...') {
          html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
        } else {
          html += `<li class="page-item${i === currentPage ? ' active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
      });
      html += `<li class="page-item${currentPage === totalPages ? ' disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">Siguiente</a></li>`;
      pagCont.innerHTML = html;
      
      pagCont.querySelectorAll('a.page-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const page = parseInt(this.getAttribute('data-page'));
          if (!isNaN(page) && page >= 1 && page <= totalPages) {
            renderAlimentos(alimentosFiltradosGlobal, page);
          }
        });
      });
    }

    // Buscador Asíncrono en Tiempo Real
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('buscador-alimentos');
      if (!input) return;
      input.addEventListener('input', function() {
        const texto = this.value.trim().toLowerCase();
        let filtered = GLOBAL_DATA.alimentos.filter(a =>
          (a.nombre && a.nombre.toLowerCase().includes(texto)) ||
          (a.categoria && a.categoria.toLowerCase().includes(texto)) ||
          (a.descripcion_nutricional && a.descripcion_nutricional.toLowerCase().includes(texto))
        );
        renderAlimentos(filtered, 1);
      });
    });

    // Orquestador del Dashboard de Gráficas Inteligentes
    function renderChartsYComponentesVisuales(perfil) {
      if (chartMacrosInstance) chartMacrosInstance.destroy();
      if (chartCarbosInstance) chartCarbosInstance.destroy();
      if (chartMineralesInstance) chartMineralesInstance.destroy();
      if (chartVitaminasInstance) chartVitaminasInstance.destroy();

      if (!perfil) return;

      // Renderizado Dinámico de Alertas Estilo Semáforo Nutricional
      const semaforoCont = document.getElementById('semaforo-nutricional');
      if (semaforoCont) {
        const calColor = perfil.calorias_kcal > 160 ? 'danger' : (perfil.calorias_kcal > 75 ? 'warning' : 'success');
        const azucarColor = perfil.azucares_g > 12 ? 'danger' : (perfil.azucares_g > 5 ? 'warning' : 'success');
        const fibraColor = perfil.fibra_g > 3.5 ? 'success' : (perfil.fibra_g > 1.5 ? 'warning' : 'secondary');

        semaforoCont.innerHTML = `
          <div class="col-6 col-md-3"><div class="p-3 border rounded bg-white shadow-sm"><span class="fs-3 fw-bold text-${calColor}">🔥 ${perfil.calorias_kcal}</span><br><small class="text-muted fw-semibold">Calorías (kcal)</small></div></div>
          <div class="col-6 col-md-3"><div class="p-3 border rounded bg-white shadow-sm"><span class="fs-3 fw-bold text-success">💪 ${perfil.proteina_g}g</span><br><small class="text-muted fw-semibold">Proteínas</small></div></div>
          <div class="col-6 col-md-3"><div class="p-3 border rounded bg-white shadow-sm"><span class="fs-3 fw-bold text-${azucarColor}">🍭 ${perfil.azucares_g}g</span><br><small class="text-muted fw-semibold">Azúcares</small></div></div>
          <div class="col-6 col-md-3"><div class="p-3 border rounded bg-white shadow-sm"><span class="fs-3 fw-bold text-${fibraColor}">🌾 ${perfil.fibra_g}g</span><br><small class="text-muted fw-semibold">Fibra Total</small></div></div>
        `;
      }

      // Gráfico 1: Macronutrientes (Doughnut)
      const ctxMacros = document.getElementById('chartMacros')?.getContext('2d');
      if (ctxMacros) {
        chartMacrosInstance = new Chart(ctxMacros, {
          type: 'doughnut',
          data: {
            labels: ['Proteínas', 'Grasas', 'Carbohidratos'],
            datasets: [{
              data: [perfil.proteina_g || 0, perfil.grasas_g || 0, perfil.carbohidratos_g || 0],
              backgroundColor: ['#2ecc71', '#e74c3c', '#f1c40f']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }

      // Gráfico 2: Desglose de Carbohidratos (Bar)
      const ctxCarbos = document.getElementById('chartCarbos')?.getContext('2d');
      if (ctxCarbos) {
        chartCarbosInstance = new Chart(ctxCarbos, {
          type: 'bar',
          data: {
            labels: ['Fibra', 'Complejos/Otros', 'Azúcares'],
            datasets: [{
              data: [perfil.fibra_g || 0, Math.max(0, (perfil.carbohidratos_g || 0) - (perfil.azucares_g || 0)), perfil.azucares_g || 0],
              backgroundColor: ['#27ae60', '#3498db', '#9b59b6']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
      }

      // Gráfico 3: Radar de Minerales (Radar)
      const ctxMinerales = document.getElementById('chartMinerales')?.getContext('2d');
      if (ctxMinerales) {
        chartMineralesInstance = new Chart(ctxMinerales, {
          type: 'radar',
          data: {
            labels: ['Calcio', 'Hierro', 'Potasio', 'Magnesio', 'Zinc'],
            datasets: [{
              label: 'Minerales (mg)',
              data: [
                perfil["minerales.calcio_mg"] || perfil.calcio_mg || 0,
                perfil["minerales.hierro_mg"] || perfil.hierro_mg || 0,
                perfil["minerales.potasio_mg"] || perfil.potasio_mg || 0,
                perfil["minerales.magnesio_mg"] || perfil.magnesio_mg || 0,
                perfil["minerales.zinc_mg"] || perfil.zinc_mg || 0
              ],
              backgroundColor: 'rgba(52, 152, 219, 0.2)',
              borderColor: '#3498db',
              pointBackgroundColor: '#2980b9'
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { r: { suggestMin: 0 } } }
        });
      }

      // Gráfico 4: Radar de Vitaminas (Radar)
      const ctxVitaminas = document.getElementById('chartVitaminas')?.getContext('2d');
      if (ctxVitaminas) {
        chartVitaminasInstance = new Chart(ctxVitaminas, {
          type: 'radar',
          data: {
            labels: ['Vit A', 'Vit C', 'Vit B1', 'Vit B2', 'Vit B3', 'Vit D'],
            datasets: [{
              label: 'Vitaminas',
              data: [
                perfil["vitaminas.vitamina_a_mcg"] || perfil.vitamina_a_mcg || 0,
                perfil["vitaminas.vitamina_c_mg"] || perfil.vitamina_c_mg || 0,
                perfil["vitaminas.vitamina_b1_mg"] || perfil.vitamina_b1_mg || 0,
                perfil["vitaminas.vitamina_b2_mg"] || perfil.vitamina_b2_mg || 0,
                perfil["vitaminas.vitamina_b3_mg"] || perfil.vitamina_b3_mg || 0,
                perfil["vitaminas.vitamina_d_mcg"] || perfil.vitamina_d_mcg || 0
              ],
              backgroundColor: 'rgba(155, 89, 182, 0.2)',
              borderColor: '#9b59b6',
              pointBackgroundColor: '#8e44ad'
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { r: { suggestMin: 0 } } }
        });
      }
    }

    // Generación de Fichas Técnicas dentro del Modal Interactivo
    function mostrarDetallesYNutricion(idAlimento) {
      const alimento = GLOBAL_DATA.alimentos.find(a => a.id == idAlimento);
      const perfil = GLOBAL_DATA.perfiles_nutricionales.find(p => (p.id_alimento == idAlimento || p.id == idAlimento));

      document.getElementById('alimentoModalLabel').textContent = alimento?.nombre || 'Especificaciones del Alimento';

      // 1. Inyección de Vista de Detalles Básicos
      let detallesHtml = '';
      if (alimento) {
        detallesHtml += `
          <div class="row p-2 align-items-start">
            <div class="col-md-4 mb-3 text-center">
              ${alimento.imagen ? `<img src="${alimento.imagen}" class="img-fluid rounded shadow-sm" alt="${alimento.nombre}" style="max-height: 240px; object-fit: cover;">` : `<div class="bg-secondary-subtle rounded d-flex align-items-center justify-content-center" style="height:200px;">Sin Imagen Disponible</div>`}
            </div>
            <div class="col-md-8">
              <h3 class="fw-bold text-dark mb-2">${alimento.nombre}</h3>
              <p><strong>Categoría General:</strong> <span class="badge bg-secondary px-3 py-2">${alimento.categoria || 'N/D'}</span></p>
              <p><strong>Zonas de Cultivo / Distribución:</strong> ${alimento.origen || 'No especificado en el registro actual.'}</p>
              <p><strong>Descripción Funcional:</strong> ${alimento.descripcion_nutricional || 'Sin descripción disponible.'}</p>
              ${alimento.limitaciones_nutricionales ? `<div class="alert alert-warning mt-3"><strong>⚠️ Restricciones / Alérgenos:</strong> ${alimento.limitaciones_nutricionales}</div>` : ''}
            </div>
          </div>`;
      } else {
        detallesHtml = '<div class="alert alert-info">Información general no indexada localmente. Presione las pestañas analíticas para consultar datos asociados.</div>';
      }
      document.getElementById('modal-detalles').innerHTML = detallesHtml;

      // 2. Inyección de Tabla de Composición Analítica de Atributos
      let nutricionHtml = '';
      if (perfil) {
        nutricionHtml += `
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle m-0 border">
              <thead class="table-dark">
                <tr><th>Componente Evaluado</th><th>Cantidad Promedio (Por cada 100g)</th></tr>
              </thead>
              <tbody>
                <tr><td><strong>Valor Energético Neto</strong></td><td><span class="badge bg-danger">${perfil.calorias_kcal || 0} kcal</span></td></tr>
                <tr><td>Proteínas Totales</td><td>${perfil.proteina_g || 0} g</td></tr>
                <tr><td>Lípidos / Grasas Totales</td><td>${perfil.grasas_g || 0} g</td></tr>
                <tr><td>Carbohidratos Disponibles</td><td>${perfil.carbohidratos_g || 0} g</td></tr>
                <tr><td>Fibra Alimentaria Intestinal</td><td>${perfil.fibra_g || 0} g</td></tr>
                <tr><td>Azúcares Libres</td><td>${perfil.azucares_g || 0} g</td></tr>
                <tr class="table-secondary fw-bold"><td colspan="2">Desglose Coexistente de Vitaminas</td></tr>
                <tr><td>Vitamina A</td><td>${perfil["vitaminas.vitamina_a_mcg"] || perfil.vitamina_a_mcg || 0} mcg</td></tr>
                <tr><td>Vitamina C (Ácido Ascórbico)</td><td>${perfil["vitaminas.vitamina_c_mg"] || perfil.vitamina_c_mg || 0} mg</td></tr>
                <tr><td>Vitamina B1 (Tiamina)</td><td>${perfil["vitaminas.vitamina_b1_mg"] || perfil.vitamina_b1_mg || 0} mg</td></tr>
                <tr><td>Vitamina B2 (Riboflavina)</td><td>${perfil["vitaminas.vitamina_b2_mg"] || perfil.vitamina_b2_mg || 0} mg</td></tr>
                <tr><td>Vitamina B3 (Niacina)</td><td>${perfil["vitaminas.vitamina_b3_mg"] || perfil.vitamina_b3_mg || 0} mg</td></tr>
                <tr><td>Vitamina D</td><td>${perfil["vitaminas.vitamina_d_mcg"] || perfil.vitamina_d_mcg || 0} mcg</td></tr>
                <tr class="table-secondary fw-bold"><td colspan="2">Estructura Minerales Esenciales</td></tr>
                <tr><td>Calcio (Ca)</td><td>${perfil["minerales.calcio_mg"] || perfil.calcio_mg || 0} mg</td></tr>
                <tr><td>Hierro (Fe)</td><td>${perfil["minerales.hierro_mg"] || perfil.hierro_mg || 0} mg</td></tr>
                <tr><td>Potasio (K)</td><td>${perfil["minerales.potasio_mg"] || perfil.potasio_mg || 0} mg</td></tr>
                <tr><td>Magnesio (Mg)</td><td>${perfil["minerales.magnesio_mg"] || perfil.magnesio_mg || 0} mg</td></tr>
                <tr><td>Zinc (Zn)</td><td>${perfil["minerales.zinc_mg"] || perfil.zinc_mg || 0} mg</td></tr>
              </tbody>
            </table>
          </div>`;
      } else {
        nutricionHtml = '<div class="alert alert-info">Desglose de composición molecular no disponible para este identificador.</div>';
      }
      document.getElementById('modal-nutricion').innerHTML = nutricionHtml;

      // Lanzamiento y Configuración de Focos en Pestañas Bootstrap
      const modalEl = document.getElementById('alimentoModal');
      const modal = new bootstrap.Modal(modalEl);
      const tabTrigger = modalEl.querySelector('#tab-detalles');
      if (tabTrigger) new bootstrap.Tab(tabTrigger).show();
      modal.show();

      // Enlace de Eventos Automáticos para Renderizado Lazy (Bajo Demanda) de Gráficos y Mapas
      const tabGraficoBtn = modalEl.querySelector('#tab-grafico');
      if (tabGraficoBtn) {
        // Clonar evento para remover listeners residuales previos
        const newTabBtn = tabGraficoBtn.cloneNode(true);
        tabGraficoBtn.parentNode.replaceChild(newTabBtn, tabGraficoBtn);
        newTabBtn.addEventListener('shown.bs.tab', () => renderChartsYComponentesVisuales(perfil));
      }

      const tabMapaBtn = modalEl.querySelector('#tab-mapa');
      if (tabMapaBtn) {
        const newMapBtn = tabMapaBtn.cloneNode(true);
        tabMapaBtn.parentNode.replaceChild(newMapBtn, tabMapaBtn);
        newMapBtn.addEventListener('shown.bs.tab', () => initMapa(alimento?.origen));
      }
    }

    // Control Geográfico con Leaflet (Instanciación Segura con Invalidation de Dimensiones)
    let _mapInitialized = false;
    let _mapInstance = null;
    function initMapa(origenText = "") {
      if (_mapInitialized) {
        if (_mapInstance) _mapInstance.invalidateSize();
        return;
      }
      const mapaDiv = document.getElementById('modal-mapa');
      if (!mapaDiv) return;

      const defaultCenter = [-2.90055, -79.00451]; // Cuenca, Ecuador
      _mapInstance = L.map('modal-mapa').setView(defaultCenter, 11);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(_mapInstance);

      L.marker(defaultCenter).addTo(_mapInstance)
        .bindPopup(`<strong>Distribución / Cultivo Principal:</strong><br>${origenText || 'Zonas locales de comercialización.'}`)
        .openPopup();
      
      _mapInitialized = true;
      setTimeout(() => { if (_mapInstance) _mapInstance.invalidateSize(); }, 300);
    }

    // =========================================================================
    //  ARQUITECTURA DE INYECCIÓN DE RESPUESTAS Y CARDS EN EL SHADOW DOM DE N8N
    // =========================================================================
    let pendingChatItems = null;
    let pendingChatOutput = '';

    // Normalizador de entradas polimórficas desde webhooks o payloads
    function normalizeAlimentoItems(rawItems) {
      if (!Array.isArray(rawItems)) return [];
      return rawItems.map(item => {
        if (item && typeof item === 'object') {
          // Extractor híbrido de llaves para máxima resiliencia ante variaciones de nombres de variables en n8n
          const id = item.id_alimento ?? item.id_alimento_asociado ?? item.id_planta ?? item.id; 
          if (id == null) return null;
          return {
            id_alimento: id,
            output: typeof item.output === 'string' ? item.output : ''
          };
        }
        if (item == null) return null;
        return { id_alimento: item, output: '' };
      }).filter(Boolean);
    }

    // Extractor de arreglos de IDs desde la estructura de n8n
    function extractAlimentoItemsFromMessage(message) {
      if (!message) return [];
      const candidates = [
        message,
        message.id_alimentos,
        message.ids_alimentos,
        message.id_plantas, // Mapeo cruzado de seguridad por si no has renombrado tu nodo de salida en n8n
        message.ids_plantas,
        message.data?.id_alimentos,
        message.data?.id_plantas,
        message.metadata?.id_alimentos
      ];
      for (const ids of candidates) {
        const normalized = normalizeAlimentoItems(ids);
        if (normalized.length) return normalized;
        if (ids && Array.isArray(ids.id_alimentos)) return normalizeAlimentoItems(ids.id_alimentos);
        if (ids && Array.isArray(ids.id_plantas)) return normalizeAlimentoItems(ids.id_plantas);
      }
      if (typeof message.content === 'object' && message.content) {
        if (Array.isArray(message.content.id_alimentos)) return normalizeAlimentoItems(message.content.id_alimentos);
        if (Array.isArray(message.content.id_plantas)) return normalizeAlimentoItems(message.content.id_plantas);
      }
      if (typeof message.content === 'string') {
        const trimmed = message.content.trim();
        if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed?.id_alimentos)) return normalizeAlimentoItems(parsed.id_alimentos);
            if (Array.isArray(parsed?.id_plantas)) return normalizeAlimentoItems(parsed.id_plantas);
          } catch {
            return [];
          }
        }
      }
      return [];
    }

    function extractOutputFromMessage(message) {
      if (!message) return '';
      if (typeof message.output === 'string') return message.output;
      if (typeof message.data?.output === 'string') return message.data.output;
      if (typeof message.content?.output === 'string') return message.content.output;
      return '';
    }

    // Buscador del Contenedor Raíz dentro del Shadow DOM del Componente Web
    function getChatMessagesContainer() {
      const webComponent = document.querySelector('n8n-chat');
      if (webComponent && webComponent.shadowRoot) {
        return webComponent.shadowRoot.querySelector('.chat-messages-list');
      }
      const chatRoot = document.querySelector('.n8n-chat') || document;
      return chatRoot.querySelector('.chat-messages-list');
    }

    // Inyector de Hojas de Estilo en la Raíz Aislada del Shadow DOM del Chat
    function ensureChatStyles(container) {
      const root = container.getRootNode();
      if (!(root instanceof ShadowRoot)) return;
      if (root.querySelector('style[data-alimentos-chat]')) return;
      const style = document.createElement('style');
      style.setAttribute('data-alimentos-chat', 'true');
      style.textContent = `
        .alimentos-chat-wrapper { margin: 0.5rem 0; max-width: 100%; }
        .alimentos-chat-cards { display: grid; grid-template-columns: 1fr; gap: 0.6rem; margin-top: 0.4rem; }
        .alimentos-chat-output { font-size: 0.92rem; color: #516476; margin: 0.2rem 0 0.4rem; line-height: 1.5; word-break: break-word; }
        .alimentos-chat-card { text-align: left; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.8rem; padding: 0.7rem 0.9rem; width: 100%; box-shadow: 0 2px 6px rgba(12,33,66,0.06); color: #0C2142; transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; }
        .alimentos-chat-card:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(12,33,66,0.1); border-color: #cbd5e1; }
        .alimentos-chat-card-title { font-weight: 600; font-size: 0.96rem; color: #0C2142; margin-bottom: 0.15rem; }
        .alimentos-chat-card-meta { font-size: 0.86rem; color: #64748b; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      `;
      root.appendChild(style);
    }

    // RENDERIZADO REPLICADO EXACTO: Creación incondicional de tarjetas interactivas
    function appendChatAlimentoCards(items, tries = 0) {
      const container = getChatMessagesContainer();
      if (!container) {
        if (tries < 4) {
          setTimeout(() => appendChatAlimentoCards(items, tries + 1), 250);
        }
        return;
      }

      ensureChatStyles(container);

      // Localizar o inicializar el nodo del mensaje del bot
      const lastBotMessage = container.querySelector('.chat-message.chat-message-from-bot:last-of-type');
      const contentEl = lastBotMessage?.querySelector('.chat-message-markdown') || lastBotMessage;

      let target = contentEl;
      if (!target) {
        const messageEl = document.createElement('div');
        messageEl.className = 'chat-message chat-message-from-bot alimentos-chat-wrapper';
        const newContent = document.createElement('div');
        newContent.className = 'chat-message-markdown';
        messageEl.appendChild(newContent);
        container.appendChild(messageEl);
        target = newContent;
      }

      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'alimentos-chat-cards';

      const alimentoMap = new Map((GLOBAL_DATA?.alimentos || []).map(a => [String(a.id), a]));
      
      items.forEach(item => {
        const id = String(item.id_alimento);
        // Fallback estructural: Si el alimento no está cargado en caché aún, se genera la card incondicionalmente
        const alimento = alimentoMap.get(id) || { id: id, nombre: 'Alimento Recomendado', descripcion_nutricional: 'Haz clic aquí para abrir su panel analítico detallado.' };

        if (item.output) {
          const output = document.createElement('div');
          output.className = 'alimentos-chat-output';
          output.textContent = item.output;
          cardsWrap.appendChild(output);
        }

        // Construcción del elemento botón/tarjeta nativo
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'alimentos-chat-card';
        card.setAttribute('data-id', alimento.id);

        const title = document.createElement('div');
        title.className = 'alimentos-chat-card-title';
        title.textContent = alimento.nombre;

        const meta = document.createElement('div');
        meta.className = 'alimentos-chat-card-meta';
        meta.textContent = alimento.descripcion_nutricional || 'Presiona para desplegar el análisis visual avanzado y tablas nutricionales.';

        card.appendChild(title);
        card.appendChild(meta);
        
        // Listener exacto para abrir los datos moleculares y lanzar los gráficos
        card.addEventListener('click', () => mostrarDetallesYNutricion(alimento.id));

        cardsWrap.appendChild(card);
      });

      target.appendChild(cardsWrap);
      container.scrollTop = container.scrollHeight;
    }

    // Administrador de Cola y Buffers del Chat de Alimentos
    function handleChatAlimentoItems(items, outputText) {
      if (!Array.isArray(items) || items.length === 0) return;
      const hasItemOutput = items.some(item => item.output);
      if (!hasItemOutput && outputText) {
        items = items.map((item, idx) => idx === 0 ? { ...item, output: outputText } : item);
      }
      if (!GLOBAL_DATA?.alimentos?.length) {
        pendingChatItems = items;
        pendingChatOutput = outputText || '';
        return;
      }
      const normalizedItems = items
        .map(item => ({
          id_alimento: item.id_alimento,
          output: item.output || ''
        }))
        .filter(item => item.id_alimento != null);
      if (normalizedItems.length) appendChatAlimentoCards(normalizedItems);
    }

    function flushPendingChatAlimentoIds() {
      if (pendingChatItems) {
        handleChatAlimentoItems(pendingChatItems, pendingChatOutput);
        pendingChatItems = null;
        pendingChatOutput = '';
      }
    }

    // Inicialización del Componente Web del Chat de n8n
    createChat({
      webhookUrl: CHAT_WEBHOOK_URL,
      mode: 'window',
      defaultLanguage: 'es',
      showWelcomeScreen: true,
      initialMessages: [
        '¡Hola! Soy tu asistente de analítica nutricional.',
        '¿Qué alimento o ingrediente deseas que comparemos hoy de forma gráfica?'
      ],
      i18n: {
        es: {
          title: '🥗 NutriAgente Analítico',
          subtitle: 'Análisis molecular y composición de alimentos.',
          inputPlaceholder: 'Pregúntame cosas como: "Frutas de bajo aporte calórico"...'
        }
      },
      onMessage: (message) => {
        const items = extractAlimentoItemsFromMessage(message);
        const outputText = extractOutputFromMessage(message);
        handleChatAlimentoItems(items, outputText);
      }
    });

    // Interceptor Global de Red (Captura automática ante flujos asíncronos HTTP de n8n)
    const originalFetch = window.fetch;
    window.fetch = async (...args) => {
      const res = await originalFetch(...args);
      try {
        res.clone().json().then(data => {
            const items = extractAlimentoItemsFromMessage(data);
            const outputText = extractOutputFromMessage(data);
            handleChatAlimentoItems(items, outputText);
        }).catch(() => {});
      } catch {}
      return res;
    };

    // Orquestador de Arranque Inicial
    (function init() {
      const cached = getCachedData();
      if (cached) {
        GLOBAL_DATA = cached;
        renderAlimentos(cached.alimentos || []);
        flushPendingChatAlimentoIds();
      }
      fetchData().then(data => {
        setCachedData(data);
        GLOBAL_DATA = data;
        renderAlimentos(data.alimentos || []);
        flushPendingChatAlimentoIds();
      }).catch(() => {
        if (!cached) {
          document.body.innerHTML = '<div class="container py-5 text-center"><h2>No se pudieron sincronizar los datos del servidor de nutrición.</h2></div>';
        }
      });
    })();
  </script>
</body>
</html>
